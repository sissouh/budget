<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon budget Ar</title>
<meta name="description" content="Suivre chaque Ar qui entre et sort, hors ligne.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calme, net, rassurant — un carnet de comptes de poche
   LAYOUT: une colonne mobile (pensée dès 320 px), barre d'onglets en bas, bouton + toujours à portée de pouce
   Règle anti-chevauchement : un champ = une ligne entière ou une moitié, jamais trois par ligne. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1a1a19);--ink:light-dark(#111110,#ededea);--mute:light-dark(#6b6b68,#a3a39e);--plane:light-dark(#ececea,#262624);--line:light-dark(#d8d8d4,#3a3a37);--yel:#ffe600;--red:light-dark(#c4161c,#ff6b6b);--okc:light-dark(#1f7a44,#5fd08f)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:clamp(22px,7vw,32px);line-height:1.1;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:19px;margin:26px 0 8px;font-weight:800;line-height:1.25}
.mute{color:var(--mute);font-size:14px}
.top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-bottom:14px}
.top h1,.top h2{text-align:center;margin:0}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.hero{background:var(--plane);border-radius:20px;padding:18px 16px}
.hero .big{font-size:clamp(30px,10vw,50px);font-weight:800;line-height:1.05;margin:6px 0;overflow-wrap:anywhere}
.hero.neg .big{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.stat b{display:block;font-size:15px;line-height:1.25;margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-left:4px solid var(--c,transparent);padding:12px 0 12px 10px;color:inherit;font:inherit;cursor:pointer}
.row .l{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.row .n{font-weight:500;overflow-wrap:anywhere}
.row .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.row .v small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.row:disabled{opacity:.45;cursor:default}
.bar{height:6px;border-radius:3px;background:var(--plane);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.over .bar i{background:var(--red)!important}
.over .v,.v.neg{color:var(--red)}
.st{font-size:13px;color:var(--mute);margin-top:4px}
.over .st{color:var(--red)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;flex:none;vertical-align:baseline}
.stat .sw{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:12px}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px;padding:10px 14px;text-align:center;text-decoration:none;line-height:30px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;line-height:20px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2f7cf6;outline-offset:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:560px;width:100%;align-items:center}
nav.tabs a{color:var(--mute);text-decoration:none;font-size:12px;text-align:center;padding:6px 0;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
nav.tabs a.on{color:var(--ink);font-weight:700}
nav.tabs svg{width:22px;height:22px}
nav.tabs a.plus span{width:56px;height:56px;border-radius:18px;background:var(--yel);color:#111;display:grid;place-items:center;font-size:32px;font-weight:500;box-shadow:0 4px 0 #111;margin-top:-26px}
/* formulaires */
label.f{display:block;margin-top:14px;font-size:14px;font-weight:700}
label.f>input,label.f>select{font-weight:400}
input,select{display:block;width:100%;max-width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;margin-top:6px}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=color]{width:44px;height:36px;padding:2px;min-height:0;margin:0;border-radius:8px;flex:none}
.amount{font-size:36px;font-weight:800;text-align:center;min-height:68px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--plane);padding:4px;border-radius:14px;margin-top:16px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 14px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;padding:0 4px}
.seg button.on{background:var(--bg);font-weight:800;box-shadow:0 1px 3px #0002}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;max-width:100%;padding:8px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;text-align:left}
.chip .sw{width:10px;height:10px;margin-right:6px}
.chip.on{background:var(--c,var(--ink));color:#fff;border-color:var(--c,var(--ink))}
.chip.on .sw{background:#fff!important}
.grp{font-size:13px;color:var(--mute);margin-top:14px}
/* journal */
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;align-items:center;gap:8px;padding:10px 0 10px 10px;border-bottom:1px solid var(--line);border-left:4px solid var(--c,transparent)}
.tx .d{overflow-wrap:anywhere}
.tx .d small{display:block;color:var(--mute);font-size:13px}
.tx .m{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tx .m small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.tx.nodel{grid-template-columns:minmax(0,1fr) auto}
.del{width:40px;height:44px;flex:none;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;padding:0}
/* cartes */
.card{background:var(--plane);border-radius:16px;padding:16px;margin-top:10px}
.card .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .big{font-size:clamp(24px,8vw,28px);font-weight:800;overflow-wrap:anywhere}
.card .bar{background:var(--bg);height:10px;border-radius:5px}
.card.dark{background:var(--ink);color:var(--bg)}
/* réglages du budget : une carte par poste, champs sur 1 ou 2 colonnes */
.gh{display:flex;align-items:center;gap:10px;margin:26px 0 8px}
.gh h2{flex:1;margin:0}
.set{border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:14px;padding:4px 12px 12px;margin-top:10px}
.set .name{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:6px;align-items:end}
.set label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.set input,.set select{margin-top:4px;min-height:44px;padding:8px 10px;color:var(--ink)}
.set .eq{font-size:13px;color:var(--mute);margin-top:6px}
.alloc{border-radius:14px;padding:14px;background:var(--plane);margin-top:8px}
.warn{color:var(--red);font-weight:700}
.okc{color:var(--okc)}
/* sauvegarde */
.sync{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);min-height:32px;margin-bottom:10px}
.sync span{overflow-wrap:anywhere}
.sync button{flex:none;min-height:32px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:4px 12px;cursor:pointer}
.sync.err span{color:var(--red)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--okc)}.dot.wait{background:#e07b00}.dot.err{background:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:9;width:max-content;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--yel);font:inherit;font-weight:800;cursor:pointer;min-height:36px;flex:none}
.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet .p{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>
</head>
<body>
<main id="app"><p class="mute">Chargement…</p></main>
<nav class="tabs" aria-label="Navigation"><div class="in">
 <a href="#accueil" data-v="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Suivi</a>
 <a href="#historique" data-v="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Journal</a>
 <a href="#saisir" data-v="saisir" class="plus" aria-label="Noter un mouvement"><span>+</span></a>
 <a href="#epargne" data-v="epargne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>Épargne</a>
 <a href="#reglages" data-v="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Budget</a>
</div></nav>
<script>
window.onerror=function(m){var a=document.getElementById("app");if(a&&/Chargement/.test(a.textContent))a.innerHTML='<p class="warn">Erreur : '+String(m).replace(/</g,"&lt;")+'</p>'};
</script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="window.onGisLoad&&onGisLoad()"></script>
<script>
if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
